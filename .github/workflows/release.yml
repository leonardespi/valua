name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-release-cargo-

      - name: Build release binary
        run: cargo build --release --package valua-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="target/${{ matrix.target }}/release/valua"
          ARCHIVE="valua-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $BINARY = "target\${{ matrix.target }}\release\valua.exe"
          $ARCHIVE = "valua-${VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ARCHIVE
          "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: valua-${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

  publish-crates-io:
    name: Publish to crates.io
    needs: publish-github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            for attempt in 1 2 3 4 5; do
              cargo publish --package "$1" --no-verify 2>&1 | tee /tmp/pub.log || true
              if grep -q "already exists" /tmp/pub.log; then
                echo "$1: skipped (already published)"
                return 0
              fi
              if grep -q "429" /tmp/pub.log; then
                echo "$1: rate limited (attempt $attempt/5), sleeping 6m..."
                sleep 360
                continue
              fi
              if grep -qE "^error" /tmp/pub.log; then
                echo "$1: failed"
                exit 1
              fi
              echo "$1: published"
              sleep 65
              return 0
            done
            echo "$1: failed after 5 attempts"
            exit 1
          }
          publish valua-diagnostics
          publish valua-ast
          publish valua-lexer
          publish valua-polyfills
          publish valua-parser
          publish valua-lint
          publish valua-codegen
          publish valua-transformer
          publish valua-core
          publish valua-cli
