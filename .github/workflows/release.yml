name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-release-cargo-

      - name: Build release binary
        run: cargo build --release --package valua-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="target/${{ matrix.target }}/release/valua"
          ARCHIVE="valua-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $BINARY = "target\${{ matrix.target }}\release\valua.exe"
          $ARCHIVE = "valua-${VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BINARY -DestinationPath $ARCHIVE
          "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: valua-${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

  publish-crates-io:
    name: Publish to crates.io
    needs: publish-github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Internal crates first (no inter-crate deps among these)
          cargo publish --package valua-diagnostics --no-verify
          sleep 15
          cargo publish --package valua-ast --no-verify
          sleep 15
          cargo publish --package valua-lexer --no-verify
          sleep 15
          cargo publish --package valua-polyfills --no-verify
          sleep 15
          # Parser depends on diagnostics + ast + lexer
          cargo publish --package valua-parser --no-verify
          sleep 15
          # Lint depends on parser + diagnostics + ast
          cargo publish --package valua-lint --no-verify
          sleep 15
          # Codegen depends on ast + diagnostics
          cargo publish --package valua-codegen --no-verify
          sleep 15
          # Transformer depends on ast + diagnostics + codegen + polyfills + parser
          cargo publish --package valua-transformer --no-verify
          sleep 15
          # Core depends on everything
          cargo publish --package valua-core --no-verify
          sleep 15
          # CLI depends on core
          cargo publish --package valua-cli --no-verify
